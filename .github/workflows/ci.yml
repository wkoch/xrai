name: Rust workspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Documentary contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.0'
      - name: Install pinned documentary tooling
        run: python -m pip install -r docs/contracts/examples/requirements.txt
      - name: Record tooling
        run: |
          python --version
          python -m pip freeze
      - name: Validate schema and contract examples
        run: python docs/contracts/verify.py
      - name: Verify rejection and failure propagation
        run: python -m unittest discover -s docs/contracts/tests -v
      - name: Verify experimental P3 comparison profile
        run: |
          python docs/contracts/experimental-p3/verify.py
          python -m unittest discover -s docs/contracts/experimental-p3/tests -v
      - name: Verify development corpus and admission gate
        run: |
          python eval/scripts/verify_corpus.py
          python -m unittest discover -s eval/scripts/tests -v
          python eval/scripts/verify_vertical.py
          python eval/scripts/verify_slot_plan.py
  workspace:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            binary: target/debug/xrai
          - runner: macos-15
            host: aarch64-apple-darwin
            binary: target/debug/xrai
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      EXPECTED_HOST: ${{ matrix.host }}
      XRAI_BINARY: ${{ matrix.binary }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      XRAI_CONTAINMENT_EVIDENCE: native-evidence/containment.jsonl
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
      - name: Install pinned evaluator tooling
        run: python -m pip install -r docs/contracts/examples/requirements.txt
      - name: Install pinned offline measurement tooling
        run: python -m pip install -r crates/xrai-eval/harness/requirements-measurement.txt
      - name: Prepare Linux evaluator sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns
          if ! bwrap --unshare-all --ro-bind / / /usr/bin/true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Record and verify native environment
        run: |
          mkdir -p native-evidence
          python -c 'import json,platform; print(json.dumps({"system": platform.system(), "platform": platform.platform(), "machine": platform.machine()}))' > native-evidence/environment.json
          rustc --version --verbose
          cargo --version
          test "$(rustc --version --verbose | awk '/^host:/ {print $2}')" = "$EXPECTED_HOST"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked 2>&1 | tee native-evidence/workspace-tests.log
      - name: Build
        run: cargo build --workspace --locked
      - name: Smoke help
        run: '"./$XRAI_BINARY" --help'
      - name: Smoke version
        run: '"./$XRAI_BINARY" --version'
      - name: Prove local harness isolation and replay
        run: |
          mkdir -p native-evidence
          python -m unittest discover -s crates/xrai-eval/harness/tests -v 2>&1 | tee native-evidence/harness-tests.log
          python crates/xrai-eval/harness/runner.py baseline --output native-evidence/baseline > native-evidence/baseline-summary.json
          python crates/xrai-eval/harness/verify_records.py native-evidence/baseline
          python crates/xrai-eval/harness/incremental.py --binary target/debug/incremental-probe --output native-evidence/incremental.json
      - name: Prove controlled token measurement and fake session ledger
        run: python crates/xrai-eval/harness/demonstrate_measurement.py --baseline native-evidence/baseline --output native-evidence/measurement
      - name: Record filesystem capabilities
        run: target/debug/filesystem-spike > native-evidence/filesystem.json
      - name: Build incorporated grammars
        run: cargo build --locked --release -p xrai-eval --bin parsing-spike --bin worker-spike --bin worker-persistent --bin semantics-spike --bin worker-benchmark --bin context-spike
      - name: Retain measured native executables
        run: python eval/scripts/retain_native_binaries.py --output native-evidence/binaries
      - name: Record worker IPC and exploratory benchmark
        run: target/release/worker-spike demonstrate > native-evidence/workers.json
      - name: Record persistent worker functional proof
        run: target/release/worker-persistent demonstrate > native-evidence/workers-persistent.json
      - name: Measure preregistered synthetic worker resources
        run: |
          python eval/scripts/measure_workers.py --output native-evidence/worker-resources --sessions 3 --requests 30 --timeout 600
          python eval/scripts/verify_worker_measurement.py native-evidence/worker-resources > native-evidence/worker-resources-verification.json
          python -c 'import shutil; shutil.rmtree("native-evidence/worker-resources/sources")'
      - name: Prove bounded context selection and retained expansion
        run: |
          python -m unittest discover -s docs/contracts/experimental-p3/tests -v
          target/release/context-spike eval/context/removed-consumer-input.json python > native-evidence/context-removed-consumer.json
          target/release/context-spike eval/context/central-hunk-input.json python > native-evidence/context-central-hunk.json
          python eval/scripts/verify_context.py eval/context/removed-consumer-input.json native-evidence/context-removed-consumer.json
          python eval/scripts/verify_context.py eval/context/central-hunk-input.json native-evidence/context-central-hunk.json
          target/release/context-spike eval/context/r3-binding-input.json python > native-evidence/context-r3-binding.json
          python eval/scripts/verify_context.py eval/context/r3-binding-input.json native-evidence/context-r3-binding.json
          python -m unittest discover -s eval/context/tests -v
      - name: Prove labeled Rust semantics and captured development sample
        run: |
          target/release/semantics-spike eval/semantics/rust-r1-r2.json > native-evidence/semantics-fixtures.json
          target/release/semantics-spike eval/semantics/tokio-development.json > native-evidence/semantics-tokio.json
          target/release/semantics-spike eval/semantics/rust-counterproofs.json > native-evidence/semantics-counterproofs.json
          python eval/scripts/verify_semantics.py eval/semantics/rust-r1-r2.json native-evidence/semantics-fixtures.json
          python eval/scripts/verify_semantics.py eval/semantics/tokio-development.json native-evidence/semantics-tokio.json
          python eval/scripts/verify_semantics.py eval/semantics/rust-counterproofs.json native-evidence/semantics-counterproofs.json
          mkdir -p native-evidence/r3
          for name in rust-r3 counterproofs-r3 counterproofs-extra counterproofs-cfg tokio-test-development incremental-events p3-consumer; do
            input="eval/semantics/r3/$name.json"
            output="native-evidence/r3/$name-completed.stdout"
            target/release/semantics-spike "$input" > "$output"
            python eval/scripts/verify_semantics.py "$input" "$output"
          done
          XRAI_R3_RECEIPT_DIR=native-evidence/r3 python -m unittest discover -s eval/semantics/r3/tests -v
      - name: Prove standalone parsing with network blocked
        run: python crates/xrai-eval/scripts/verify_packaging.py --binary target/release/parsing-spike --output native-evidence/packaging.json
      - name: Preserve native receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.host }}
          path: native-evidence
          if-no-files-found: error
          retention-days: 90
  corpus-rust:
    name: L5 real Rust behavioral pair
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
      - name: Prepare Linux evaluator
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! bwrap --unshare-all --ro-bind / / /usr/bin/true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          rustup toolchain install 1.98.1 --profile minimal
          python -m pip install -r docs/contracts/examples/requirements.txt
      - name: Verify capture and run behavioral pair
        run: |
          python eval/scripts/collect_real_rust.py verify
          python eval/scripts/run_real_rust_probes.py --output "$RUNNER_TEMP/rust-probes" --domain-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-rust"
      - name: Preserve Rust evaluator receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l5-real-rust
          path: |
            ${{ runner.temp }}/rust-probes/summary.json
            ${{ runner.temp }}/rust-probes/baseline
            ${{ runner.temp }}/rust-probes/reference
          if-no-files-found: error
          retention-days: 90
  corpus-js:
    name: L5 real JavaScript behavioral pair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '16.20.2'
      - name: Prepare Linux evaluator and pinned package manager
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! bwrap --unshare-all --ro-bind / / /usr/bin/true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          npm install --global yarn@1.22.22 --ignore-scripts
          node --version
          yarn --version
          python -m pip install -r docs/contracts/examples/requirements.txt
      - name: Prepare and prove baseline
        run: |
          python eval/scripts/prepare_l5_js.py verify
          python eval/scripts/run_l5_js.py materialize --workspace "$RUNNER_TEMP/react-base" --side base
          cd "$RUNNER_TEMP/react-base"
          yarn install --frozen-lockfile --ignore-scripts --non-interactive --no-progress
          cd "$GITHUB_WORKSPACE"
          python eval/scripts/run_l5_js.py probe --workspace "$RUNNER_TEMP/react-base" --side base --node "$(command -v node)" --output "$RUNNER_TEMP/js-probes/base"
      - name: Prepare and prove reference
        run: |
          python eval/scripts/run_l5_js.py materialize --workspace "$RUNNER_TEMP/react-reference" --side reference
          cd "$RUNNER_TEMP/react-reference"
          yarn install --frozen-lockfile --ignore-scripts --non-interactive --no-progress
          cd "$GITHUB_WORKSPACE"
          python eval/scripts/run_l5_js.py probe --workspace "$RUNNER_TEMP/react-reference" --side reference --node "$(command -v node)" --output "$RUNNER_TEMP/js-probes/reference"
      - name: Preserve JavaScript evaluator receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l5-real-js
          path: ${{ runner.temp }}/js-probes
          if-no-files-found: error
          retention-days: 90
