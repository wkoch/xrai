name: Rust workspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Documentary contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.0'
      - name: Install pinned documentary tooling
        run: python -m pip install -r docs/contracts/examples/requirements.txt
      - name: Record tooling
        run: |
          python --version
          python -m pip freeze
      - name: Validate schema and contract examples
        run: python docs/contracts/verify.py
      - name: Verify rejection and failure propagation
        run: python -m unittest discover -s docs/contracts/tests -v
  workspace:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            binary: target/debug/xrai
          - runner: macos-15
            host: aarch64-apple-darwin
            binary: target/debug/xrai
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      EXPECTED_HOST: ${{ matrix.host }}
      XRAI_BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Record and verify native environment
        run: |
          rustc --version --verbose
          cargo --version
          test "$(rustc --version --verbose | awk '/^host:/ {print $2}')" = "$EXPECTED_HOST"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Smoke help
        run: '"./$XRAI_BINARY" --help'
      - name: Smoke version
        run: '"./$XRAI_BINARY" --version'
