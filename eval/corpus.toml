schema_version = 2
purpose = "development_only"
statistical_confirmation = false

[datasets.D0]
path = "tasks/dev.jsonl"
expected_tasks = 20
per_family = 5

[datasets.D1]
path = "tasks/challenge-dev.jsonl"
expected_tasks = 32
per_family = 8
minimum_repositories_per_family = 2
class = "seed"
eligibility = "development_and_regression_only_ADR021"

[datasets.qualified]
path = "tasks/challenge-qualified.jsonl"
class = "qualified"
expected_tasks = 32
admission = "python3 eval/scripts/verify_qualified.py"
competitive_runs_allowed_without_admission = false

[datasets.supplementary]
path = "tasks/supplementary.jsonl"
class = "supplementary"
counts_as_primary = false

[datasets.vertical_candidates]
path = "qualification/vertical/candidates.jsonl"
class = "vertical_evidence_only"
expected_tasks = 4
admission = "python3 eval/scripts/verify_vertical.py"
counts_as_admitted_primary = false
competitive_runs_allowed = false

[provenance]
manifest = "sources/manifest.json"
immutable_git_commits = true
oracles = "oracles/"
label_method = "manual_upstream_source_and_history_review"

[isolation]
materializer = "scripts/materialize_task.py"
agent_input = ["workspace/**", "request.json", "proposed.diff (review only)"]
reference_patches_in_agent_input = false
ranking_roots = ["materialized_task/workspace"]
holdout_policy = "HOLDOUT-POLICY.md"

[fixtures]
manifest = "fixtures/manifest.json"
generator = "scripts/generate_fixtures.py"
seed = "no-randomness-v1"
modules = 64
large_function_statements = 2048
counts_as_real_tasks = false

[validation]
manifest_and_isolation = "python3 eval/scripts/verify_corpus.py"
local_regressions = "python3 eval/scripts/verify_oracles.py"
qualified_admission = "python3 eval/scripts/verify_qualified.py"
admission_tests = "python3 -m unittest discover -s eval/scripts/tests -v"
agent_sessions = "not_run_requires_M0-04"
